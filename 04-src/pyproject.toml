[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain"
version = "0.1.0"
description = "Factory Brain - orquestador de agentes de desarrollo de software"
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1,<4",
    "libtmux>=0.37,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
brain = "brain.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
