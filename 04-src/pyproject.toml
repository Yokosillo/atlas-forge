[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas_forge"
version = "0.1.0"
description = "Atlas Forge - orquestador de agentes de desarrollo de software"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "libtmux>=0.37,<1",
    "requests>=2.31,<3",
    "uvicorn>=0.32,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
atlas-forge-api = "atlas_forge.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# T-AF025-US04-02: división de suite por marcadores — `unit` es el
# subconjunto determinista/rápido que `run_tests` ejecuta por defecto
# (no arranca tmux/agentes reales ni backend en vivo; la integración se
# marca `integration`). Los tests sin marcador se consideran integración.
markers = [
    "unit: subconjunto determinista y rapido (sin tmux/agentes reales/backend en vivo)",
    "integration: suite de integracion (puede requerir tmux/agentes/backend reales)",
]
