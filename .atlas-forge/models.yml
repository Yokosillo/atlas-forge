# Catalogo de modelos disponibles en Atlas Forge (T-AF022-US09-02).
#
# Cada entrada declara un modelo con su identificador real (el que se pasa a
# --model), nombre visible y runtime asociado.
#
# Runtimes soportados: opencode, claude_code, codex.
# No se admiten IDs duplicados ni runtimes no soportados.
#
# Editar este fichero sin tocar codigo Python ni redeploy — los cambios se
# reflejan al recargar (cache TTL con validacion de mtime).

models:
  - id: opencode-go/deepseek-v4-flash
    name: "DeepSeek V4 Flash (patrip)"
    runtime: opencode

  - id: opencode-go/deepseek-v4-pro
    name: "DeepSeek V4 Pro (patrip)"
    runtime: opencode

  - id: opencode-go/deepseek-v4-flash-alt
    name: "DeepSeek V4 Flash (atlas)"
    runtime: opencode

  - id: opencode-go/deepseek-v4-pro-alt
    name: "DeepSeek V4 Pro (atlas)"
    runtime: opencode

  - id: opencode-go/deepseek-v4-flash-2
    name: "DeepSeek V4 Flash (jareth)"
    runtime: opencode

  - id: opencode-go/deepseek-v4-pro-2
    name: "DeepSeek V4 Pro (jareth)"
    runtime: opencode

  - id: sonnet
    name: "Sonnet"
    runtime: claude_code

  - id: opus
    name: "Opus"
    runtime: claude_code

  - id: haiku
    name: "Haiku"
    runtime: claude_code

  # Codex activado como runtime real (T-AF024-US11-13, 2026-08-17,
  # ampliacion de alcance explicita del usuario, fuera del roadmap v1
  # original). Slugs verificados contra el catalogo real de la CLI
  # instalada (~/.codex/models_cache.json, codex-cli 0.144.1) — los 2 de
  # mayor prioridad con visibility "list" (se excluye
  # "codex-auto-review", visibility "hide", claramente interno).
  - id: gpt-5.6-terra
    name: "GPT-5.6 Terra"
    runtime: codex

  - id: gpt-5.6-luna
    name: "GPT-5.6 Luna"
    runtime: codex
