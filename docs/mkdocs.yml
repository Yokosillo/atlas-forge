site_name: Factory Brain
site_description: AI-assisted software development coordination from a single platform.
site_url: https://factoria-software.github.io/factory-brain/
repo_url: https://github.com/factoria-software/factory-brain
repo_name: factory-brain
edit_uri: blob/main/docs/

# This configuration is published together with the content: mkdocs.yml and the
# .md files live in the same directory (docs/). Build with:
#   mkdocs build -f docs/mkdocs.yml
docs_dir: .

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tasklist
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search
  - i18n:
      default_language: en
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: es
          name: Español
          build: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Concepts: concepts.md
  - Web interface: interfaces-web.md
  - API: api.md
  - Agents: agents.md
  - Runtime and Scribe: runtime.md
  - Jobs: jobs.md
  - Scripts: scripts.md
  - Backlog and pipeline: backlog.md
  - Configuration: configuration.md
  - Roadmap: roadmap.md
  - FAQ and troubleshooting: faq.md
  - Development: development.md