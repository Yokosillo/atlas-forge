# Catalogo de modelos disponibles en Factory Brain (T-FB022-US09-02).
#
# Cada entrada declara un modelo con su identificador real (el que se pasa a
# --model), nombre visible y runtime asociado.
#
# Runtimes soportados: opencode, claude_code, codex.
# No se admiten IDs duplicados ni runtimes no soportados.
#
# Editar este fichero sin tocar codigo Python ni redeploy — los cambios se
# reflejan al recargar (cache TTL con validacion de mtime).

models:
  - id: opencode-go/deepseek-v4-flash
    name: "DeepSeek V4 Flash"
    runtime: opencode

  - id: opencode-go/deepseek-v4-pro
    name: "DeepSeek V4 Pro"
    runtime: opencode

  - id: opencode-go/glm-5.2
    name: "GLM 5.2"
    runtime: opencode

  - id: opencode-go/kimi-k3
    name: "Kimi K3"
    runtime: opencode

  - id: claude-code
    name: "Claude Code"
    runtime: claude_code

  # GPT/Codex: entrada futura — no activa porque Codex esta fuera del alcance
  # v1 segun el roadmap (ver 02-backlog/roadmap.md). Descomentar cuando Codex
  # este soportado como runtime real en Factory Brain.
  # - id: openai/gpt-5
  #   name: "GPT-5 (Codex)"
  #   runtime: codex
